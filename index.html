<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e14"><title>BLOODWAKE｜血月獵場</title><link rel="stylesheet" href="/src/style.css"></head>
<body>
  <main id="app">
    <div id="world" aria-label="血月獵場 3D 遊戲場景"></div><div class="vignette"></div><div id="damage-flash"></div>
    <div id="hud" class="hidden">
      <div class="xp-track"><div id="xp-bar"></div></div>
      <header class="hud-top"><div class="brand">BLOODWAKE<small>血 月 獵 場</small></div><div class="clock"><span id="timer">00:00</span><small>存活至 05:00</small></div><div class="utilities"><button id="pause" aria-label="暫停遊戲">Ⅱ <span>暫停</span></button><button id="sound" aria-label="切換音效">♪ <span>音效 開</span></button></div></header>
      <div id="boss-hud" class="hidden"><span>血月典獄長</span><div><i id="boss-health"></i></div></div>
      <div id="toast" role="status"></div>
      <footer class="hud-bottom"><div class="vitals"><div class="health-number"><span class="sigil">♢</span><span id="hp">100</span><small>/ <span id="max-hp">100</span></small></div><div class="health-track"><i id="health-bar"></i></div><small class="hint">WASD 移動 · 滑鼠瞄準 · 按住左鍵射擊</small></div><div class="skills"><div class="skill"><svg viewBox="0 0 48 48"><path d="m10 38 5-12L34 7l7 7-19 19-12 5Zm5-12 7 7M29 12l7 7"/></svg><span>銀彈</span><kbd>滑鼠</kbd></div><button class="skill" id="dash"><svg viewBox="0 0 48 48"><path d="m8 28 13-8 9 4-6 9 14 7M24 33l-9 7M22 20l8-9 8 8M6 15h11M3 21h9"/><circle cx="36" cy="7" r="3"/></svg><span id="dash-label">衝刺</span><kbd>SPACE</kbd><i id="dash-cooldown"></i></button><button class="skill" id="nova"><svg viewBox="0 0 48 48"><path d="m24 4 4 14 16 6-16 5-4 15-5-15-15-5 15-6Z"/><circle cx="24" cy="24" r="16"/></svg><span id="nova-label">新星</span><kbd>E</kbd><i id="nova-cooldown"></i></button></div><div class="score"><small>擊殺 <strong id="kills">0</strong></small><div>LV <span id="level">1</span></div><small id="auto-status">F 自動射擊：關</small></div></footer>
      <div id="reticle"><i></i></div><div id="touch-controls"><div id="move-pad" class="touch-pad"><span>移動</span><i></i></div><div id="aim-pad" class="touch-pad"><span>瞄準射擊</span><i></i></div></div>
    </div>
    <section id="menu" class="overlay menu"><div class="menu-art"></div><div class="menu-content"><div class="ornament">✦</div><h1>BLOODWAKE</h1><h2>血 月 獵 場</h2><p>當最後一道鐘聲落下，<br>以銀彈，換取黎明。</p><button id="start" class="primary">踏入獵場 <span>→</span></button><div class="menu-actions"><button id="open-legacy">獵人傳承 <span id="bank">0</span> 殘魂</button><button id="open-help">操作指南</button></div><div class="menu-foot">3D 俯視射擊 <b>·</b> 隨機強化 <b>·</b> 每局 5 分鐘</div><small id="best"></small></div><span class="version">可玩原型 / 0.1</span></section>
    <section id="dialog" class="overlay hidden"><div class="dialog-panel" id="dialog-content"></div></section>
    <div id="fatal" class="overlay hidden"><div class="dialog-panel"><h2>無法啟動 3D 獵場</h2><p id="fatal-message"></p><button onclick="location.reload()" class="primary">重新載入</button></div></div>
  </main><script type="module" src="/src/main.js"></script>
</body></html>
